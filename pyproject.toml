[project]
name = "neural-network"
version = "0.1.0"
description = "Introductory lessons on machine learning and neural networks"
readme = "README.md"
authors = [
    { name = "Developer", email = "epistula.kunyu@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
]

[project.scripts]
neural-network = "neural_network:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.5",
    "pytest>=9.2.0",
]
